name: Kailera Therapeutics
description: >-
  Kailera Therapeutics is a clinical-stage biopharmaceutical company focused on
  the next generation of obesity and cardiometabolic care through a diversified
  pipeline of GLP-1 based therapies. Founded in 2024 and headquartered in
  Waltham, Massachusetts, its lead candidate ribupatide (KAI-9531) is a
  once-weekly injectable GLP-1/GIP receptor dual agonist in a global Phase 3
  program, alongside oral small-molecule GLP-1 candidates and tri-agonist
  programs licensed in part from Jiangsu Hengrui Pharmaceuticals. Kailera has
  raised a $400M Series A and a $600M Series B led by Bain Capital, and priced
  its IPO in April 2026 (NASDAQ: KLRA). This is a corporate/portfolio company
  profile in the API Evangelist network; Kailera publishes no public developer
  API surface.
